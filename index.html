<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LaslesVPN | Fast, private and simple VPN</title>
  <meta name="description" content="LaslesVPN is a private virtual network with unique features and high security.">

  <!-- Load the Poppins font from Google Fonts; preconnect speeds up the download -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Skip link lets keyboard users jump past the navigation -->
  <a class="skip" href="#main">Skip to main content</a>

  <!-- <header> is a landmark, so screen readers can jump straight to it -->
  <header class="header">
    <div class="wrapper header-content">

      <!-- Logo links back to the homepage The alt text describes where the link goes -->
      <a class="logo" href="index.html">
        <img src="images/logo.png" alt="LaslesVPN home">
      </a>

      <!-- aria-label tells screen readers which nav this is  -->
      <nav class="nav" aria-label="Main">
        <ul>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#features">Features</a></li>
          <li><a href="pricing.html">Pricing</a></li>
          <li><a href="index.html#testimonials">Testimonials</a></li>
          <li><a href="contact.html">Help</a></li>
        </ul>
      </nav>

      <!-- Sign In is a plain text link Sign Up is the outlined pill button from the mockup -->
      <div class="links">
        <a class="signin" href="#">Sign In</a>
        <a class="button button-outline" href="#">Sign Up</a>
      </div>

    </div>
  </header>

  <!-- id="main" is the target of the skip link above -->
  <main id="main">
  </main>

</body>
</html>
